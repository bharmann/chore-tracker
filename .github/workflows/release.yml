name: Release

# Push a tag like v1.4.0 and this builds the firmware and publishes a GitHub
# release the station can install from (Admin > System Info > Install update,
# or the web editor's Family tab). Release assets:
#   ChoreStation.bin       app image the station downloads (OTA)
#   version.json           {"version","size","sha256"} the station checks first
#   ChoreStation-full.bin  bootloader + partitions + app, for a USB flash at 0x0
#                          (esptool.py write_flash 0x0 ChoreStation-full.bin)
#
# No git needed: Actions > Release > Run workflow, type the version (e.g.
# v1.4.1), and it releases the latest main under that tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v1.4.1 (must be newer than the last one)'
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo "Version must look like v1.4.1, got '$VERSION'"; exit 1; }

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries (pinned to tested versions)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install "TFT_eSPI@2.5.43" "MFRC522@1.4.12" "ArduinoJson@7.4.3"

      - name: Use this repo's TFT_eSPI config
        run: cp User_Setup.h "$(arduino-cli config get directories.user)/libraries/TFT_eSPI/User_Setup.h"

      - name: Stamp the version into the firmware
        run: |
          printf '#pragma once\n#define FW_VERSION "%s"\n' "$VERSION" > ChoreStation/version.h
          cat ChoreStation/version.h

      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs --warnings default --output-dir out ChoreStation

      - name: Package
        run: |
          cp out/ChoreStation.ino.bin ChoreStation.bin
          cp out/ChoreStation.ino.merged.bin ChoreStation-full.bin
          SIZE=$(stat -c%s ChoreStation.bin)
          SHA=$(sha256sum ChoreStation.bin | cut -d' ' -f1)
          printf '{"version":"%s","size":%s,"sha256":"%s"}\n' "$VERSION" "$SIZE" "$SHA" > version.json
          cat version.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" ChoreStation.bin version.json ChoreStation-full.bin \
            --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
